<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Party Night</title>
<meta name="theme-color" content="#0f0b1e">
<link rel="stylesheet" href="/style.css">
<style>
  body{padding:0 16px 24px;font-size:17px}
  .top{display:flex;align-items:center;gap:10px;padding:14px 0;min-height:64px}
  .top .me{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .top .pts{margin-left:auto;color:var(--mute);font-weight:700}
  .top .timer{font-size:9px;margin-left:10px}
  #app{max-width:480px;margin:0 auto}
  h2{font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:12px 0 18px;text-wrap:balance}
  p{color:var(--mute);margin:6px 0 16px}
  .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--gold);font-weight:700}
  label{display:block;margin:16px 0 6px;font-weight:700;color:var(--mute);font-size:14px;text-transform:uppercase;letter-spacing:.1em}
  input{width:100%;font:inherit;font-size:19px;padding:15px 16px;border-radius:14px;border:2px solid transparent;background:var(--card);color:var(--ink)}
  input:focus{border-color:var(--gold);outline:0}
  input::placeholder{color:#ffffff59}
  .btn{width:100%;font-size:19px;margin-top:18px;padding:16px}
  .opt{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:16px 18px;margin:10px 0;font-size:17px;line-height:1.35;
    border:2px solid transparent;transition:transform .1s,border-color .15s}
  #app .opt{animation:rise .4s ease-out both} #app .opt:nth-of-type(2){animation-delay:.05s} #app .opt:nth-of-type(3){animation-delay:.1s} #app .opt:nth-of-type(4){animation-delay:.15s} #app .opt:nth-of-type(n+5){animation-delay:.2s}
  .opt.on{animation:done-pop .35s cubic-bezier(.2,1.6,.4,1)}
  .opt:active{transform:scale(.98)} .opt.on{border-color:var(--gold);background:var(--card2)}
  .opt b{color:var(--gold)}
  .err{color:var(--coral);min-height:22px;font-weight:700;text-align:center;margin-top:10px}
  .wait{text-align:center;padding-top:8vh}
  .wait .av{font-size:44px;animation:bob 2.4s ease-in-out infinite}
  .logo{font-size:44px;font-weight:800;letter-spacing:-.04em;text-align:center;margin:8vh 0 6px}
  .logo span{color:var(--gold)}
  .sndbar{display:flex;gap:8px;margin-top:8px}
  .sndbar select{flex:1;font:inherit;padding:10px 12px;border-radius:12px;border:0;background:var(--card);color:var(--ink)}
  .sndbar .pv{padding:0 16px;border-radius:12px;background:var(--card2);font-weight:800}
  .sndbar .add{background:var(--sky);color:#0b1a30}
  .avs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:10px 0 4px}
  .avs button,.avs .up{aspect-ratio:1;min-width:0;margin:0;padding:0;border-radius:16px;background:var(--card);border:2px solid transparent;
    display:grid;place-items:center;font-size:clamp(22px,7.5vw,32px);line-height:1;transition:transform .15s cubic-bezier(.2,1.6,.4,1),background .15s}
  .avs button:active,.avs .up:active{transform:scale(.9)}
  .avs button.on{border-color:var(--gold);transform:scale(1.06);box-shadow:0 4px 0 #0005}
  .avs button:disabled{opacity:.2}
  /* photo tile: dashed until a photo is in, caption under the camera */
  .avs .up{background:var(--card2);border:2px dashed #ffffff40;cursor:pointer;overflow:hidden;text-transform:none;letter-spacing:0;color:var(--mute)}
  .avs .up small{display:block;font-size:10px;font-weight:800;margin-top:2px}
  .avs .up.on{border:2px solid var(--gold)} .avs .up img{width:100%;height:100%;object-fit:cover}
  #hostp{max-width:480px;margin:12px auto;border-bottom:1px solid var(--line);padding-bottom:10px}
  #app+#hostp{border-bottom:0;border-top:1px solid var(--line);margin-top:28px;padding-top:6px}
  #hostp:empty{display:none}
  #hostp .row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  #hostp .row .btn{flex:1;width:auto;margin:0;padding:12px 14px;font-size:16px;min-width:40%}
  #hostp .seg{display:flex;background:var(--bg2);border-radius:999px;padding:3px;margin-bottom:6px}
  #hostp .seg button{flex:1;background:transparent;border-radius:999px;padding:9px 4px;font-weight:700;color:var(--mute);font-size:14px}
  #hostp .seg button.on{background:var(--ink);color:#1a1230}
  #hostp summary{cursor:pointer;font-weight:800;padding:10px 0}
  #hostp .pl{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:700}
  #hostp .pl .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hostp .pl button{background:var(--card);border-radius:10px;padding:8px 10px}
  #c{text-transform:uppercase;letter-spacing:.4em;font-weight:800;text-align:center;font-size:26px}
</style></head><body><div class="stage"></div>
<div class="top" id="top"></div><div id="app"></div><div id="hostp"></div><div class="err" id="err" role="alert"></div>
<script src="/common.js"></script>
<script>
const app = document.getElementById('app'), errEl = document.getElementById('err'), topEl = document.getElementById('top');
// ?p=2 gives each test phone its own identity in one browser; ?room=&name= prefill, &auto=1 joins straight away
const q = new URLSearchParams(location.search), ns = q.get('p') || '';
const store = (k, v) => v === undefined ? localStorage[k + ns] : (localStorage[k + ns] = v);
// id survives refresh so a phone that reloads keeps its seat
const id = store('pid') || store('pid', Math.random().toString(36).slice(2));
let drawnAt = 0;
let room = q.get('room') || store('room') || '', es, last = '', chosen = -1;
async function send(type, extra = {}) {
  const r = await fetch('/action', { method: 'POST', body: JSON.stringify({ id, room, type, ...extra }) });
  errEl.textContent = r.ok ? '' : (await r.json()).error;
  if (!r.ok) { errEl.classList.remove('shake'); void errEl.offsetWidth; errEl.classList.add('shake'); }
  if (r.ok) { sfx('tap'); navigator.vibrate?.(15); } else sfx('leave');
  return r.ok;
}

function joinScreen() {
  es?.close(); last = ''; topEl.innerHTML = '';
  app.innerHTML = `<div class="logo pop">Party <span>Night</span></div><p style="text-align:center">Enter the code on the TV</p>
    <label for="c">Room code</label><input id="c" maxlength="4" placeholder="ABCD" value="${esc(room)}" autocapitalize="characters" autocomplete="off">
    <label for="n">Your name</label><input id="n" maxlength="16" placeholder="Name" value="${esc(q.get('name') || store('name') || '')}" autocomplete="nickname">
    <label>Pick your avatar</label>${avGrid(Number(store('av') ?? -1), [], 'pickAv', photo)}
    <button class="btn" onclick="join()">Let's go!</button>`;
}
async function join() {
  room = c.value.trim().toUpperCase(); store('name', n.value);
  const av = Number(store('av') ?? -1);
  if (await send('join', { text: n.value, av })) { store('room', room); if (photo) await send('photo', { data: photo }); watch(); }
}
// avatar grid; `taken` are greyed out, `fn` handles a tap
const avGrid = (cur, taken, fn, ph) => `<div class="avs"><label class="up ${ph ? 'on' : ''}" aria-label="Upload a photo">${ph ? `<img src="${esc(ph)}" alt="">` : '<span>📷<small>Photo</small></span>'}<input type="file" accept="image/*" hidden onchange="upload(this.files[0])"></label>
  ${ph ? `<button aria-label="Remove photo" onclick="setPhoto('')">🚫</button>` : ''}${AV_EMOJI.map((e, i) =>
  `<button class="${i === cur && !ph ? 'on' : ''}" style="${i === cur && !ph ? `background:${AV_COLOR[i % AV_COLOR.length]}` : ''}" data-i="${i}" aria-label="Avatar ${i + 1}" ${taken.includes(i) ? 'disabled' : ''} onclick="${fn}(${i})">${e}</button>`).join('')}</div>`;
// Photo avatars: cropped to a centred square and shrunk to a small JPEG on the phone, so uploads are tiny.
// Kept only in memory here and on the server, so it's gone once the player leaves.
let photo = '';
async function upload(file) {
  if (!file) return;
  try {
    const img = await createImageBitmap(file), n = Math.min(img.width, img.height), c = document.createElement('canvas');
    c.width = c.height = 160;
    c.getContext('2d').drawImage(img, (img.width - n) / 2, (img.height - n) / 2, n, n, 0, 0, 160, 160);
    setPhoto(c.toDataURL('image/jpeg', .8));
  } catch { errEl.textContent = "Couldn't read that picture"; }
}
async function setPhoto(data) {
  if (es && room && store('room') === room) { if (await send('photo', { data })) photo = data; }
  else { photo = data; redrawJoinGrid(); } // not joined yet: show it, send it after joining
}
// only the grid, so the code and name already typed stay put
function redrawJoinGrid() { const g = app.querySelector('.avs'); if (g) g.outerHTML = avGrid(Number(store('av') ?? -1), [], 'pickAv', photo);
}
function pickAv(i) { if (photo) { photo = ''; redrawJoinGrid(); } store('av', i); document.querySelectorAll('.avs [data-i]').forEach(b => { const on = +b.dataset.i === i; b.classList.toggle('on', on); b.style.background = on ? AV_COLOR[i % AV_COLOR.length] : ''; }); }
async function rename() { const v = nm.value.trim(); if (v && await send('join', { text: v })) store('name', v); }
async function changeAv(i) { if (await send('avatar', { av: i })) { store('av', i); if (photo) setPhoto(''); } }
// Enter / "Go" on the phone keyboard: jump to the next empty box, or press the screen's main button.
// (Never return false from a key handler here: that blocks typing.)
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  e.preventDefault();
  // A held or double-tapped Enter used to submit the next screen too (e.g. the second joke, blank).
  // So: ignore Enter right after a new screen appears, and never submit from an empty box.
  if (e.repeat || Date.now() - drawnAt < 1000 || !e.target.value.trim()) return;
  if (e.target.id === 'nm') return rename();
  const empty = [...app.querySelectorAll('input')].find(i => !i.value.trim() && i !== e.target);
  if (empty) empty.focus(); else app.querySelector('.btn')?.click();
});
function leave() { document.getElementById('hostp').innerHTML = ''; room = ''; store('room', ''); joinScreen(); }
function choose(i) { chosen = i; document.querySelectorAll('.opt').forEach((b, j) => b.classList.toggle('on', j === i)); document.getElementById('p')?.focus(); }
const sendWords = () => send('words', { words: [...document.querySelectorAll('.w')].map(i => i.value) });
// sound picker under an answer box: picking one previews it, + drops <name> in at the cursor
const soundBar = inp => `<div class="sndbar"><select aria-label="Sound effect" onchange="sfx(this.value)">${Object.keys(SOUNDS).map(n => `<option>${n}</option>`).join('')}</select>
  <button class="pv" aria-label="Preview sound" onclick="sfx(this.previousElementSibling.value)">▶</button><button class="pv add" onclick="addSound('${inp}', this.parentNode.firstElementChild.value)">+ Add</button></div>`;
function addSound(inp, n) {
  const el = document.getElementById(inp), at = el.selectionStart ?? el.value.length, tag = `<${n}>`;
  if (el.value.length + tag.length > el.maxLength) return errEl.textContent = 'No room for another sound';
  el.value = el.value.slice(0, at) + tag + el.value.slice(el.selectionEnd ?? at); el.focus(); el.setSelectionRange(at + tag.length, at + tag.length);
}
const wait = (me, title, msg = 'Eyes on the TV!') => `<div class="wait">${avatar(me, 'xl')}<h2 class="pop">${title}</h2><p>${msg}</p></div>`;

// one screen builder per game mode and phase
const MODES = {
  punchline: {
    words: (s, me) => me.done ? wait(me, 'Words sent!', 'Waiting for the others…') :
      `<div class="kicker">Step 1 of 3</div><h2>Give us some words</h2>${s.cats[id].map((c, i) =>
        `<label for="w${i}">${esc(c)}</label><input id="w${i}" class="w" maxlength="30" autocomplete="off">`).join('')}<button class="btn" onclick="sendWords()">Send words</button>`,
    write: (s, me) => me.done || !s.opts[id] ? wait(me, 'Jokes written!', 'Waiting for the others…') :
      `<div class="kicker">Step 2 of 3</div><h2>Pick a setup</h2>${s.opts[id].map((o, i) => `<button class="opt" onclick="choose(${i})">${esc(o)}…</button>`).join('')}
       <label for="p">Punchline</label><input id="p" maxlength="100" placeholder="…and that's why" autocomplete="off">${soundBar('p')}<button class="btn" onclick="send('joke',{pick:chosen,text:p.value})">Tell it</button>`,
    duel: (s, me) => me.done ? wait(me, s.duel ? 'Vote locked' : 'Waiting…', 'Eyes on the TV!') :
      `<div class="kicker">Joke-off ${s.duelNo} of ${s.duelCount}</div><h2>Which is funnier?</h2>${s.duel.map((j, i) =>
        `<button class="opt" onclick="send('vote',{index:${i}})">${esc(j.setup)} <b>${withSounds(j.punch)}</b></button>`).join('')}`,
  },
  quickwit: {
    answer: (s, me) => me.done ? wait(me, 'Answer locked in!') :
      `<div class="kicker">Round ${s.round}</div><h2>${esc(s.prompt)}</h2><input id="a" maxlength="80" placeholder="Your answer" autocomplete="off">${soundBar('a')}
       <button class="btn" onclick="send('answer',{text:a.value})">Send</button>`,
    vote: (s, me) => me.done ? wait(me, 'Vote cast!') :
      `<div class="kicker">Vote</div><h2>Pick the best answer</h2>${s.list.map((a, i) => `<button class="opt" onclick="send('vote',{index:${i}})">${withSounds(a.text)}</button>`).join('')}`,
  },
  fakeout: {
    lie: (s, me) => me.done ? wait(me, 'Fake locked in!') :
      `<div class="kicker">Fill the blank with a fake</div><h2>${esc(s.fact)}</h2><input id="a" maxlength="40" placeholder="Something believable" autocomplete="off">
       <button class="btn" onclick="send('lie',{text:a.value})">Send fake</button>`,
    pick: (s, me) => me.done ? wait(me, 'Pick locked!') :
      `<div class="kicker">Which one is real?</div><h2>${esc(s.fact)}</h2>${s.list.map((a, i) => `<button class="opt" onclick="send('guess',{index:${i}})">${esc(a.text)}</button>`).join('')}`,
  },
  hottake: {
    take: (s, me) => me.done ? wait(me, 'Take locked in!') :
      `<div class="kicker">Hot take</div><h2>${esc(s.take)}</h2><button class="opt" onclick="choose(0)">👍 <b>Agree</b></button><button class="opt" onclick="choose(1)">👎 <b>Disagree</b></button>
       <label for="g">How much of the room agrees? <b id="gv" style="color:var(--gold)">50%</b></label><input id="g" type="range" min="0" max="100" step="5" value="50" oninput="gv.textContent = this.value + '%'" style="padding:0;accent-color:var(--gold)">
       <button class="btn" onclick="send('take',{agree:chosen < 0 ? null : chosen === 0, guess:+g.value})">Lock it in</button>`,
  },
  oddone: {
    clue: (s, me) => me.done ? wait(me, 'Clue sent!', 'Act natural…') :
      `<div class="kicker">Your secret word</div><h2 style="font-size:40px;color:var(--gold)">${esc(s.secret[id])}</h2><p>Everyone has the same word except one player. Maybe it's you!</p>
       <input id="a" maxlength="20" placeholder="One-word clue" autocomplete="off"><button class="btn" onclick="send('clue',{text:a.value})">Send clue</button>`,
    accuse: (s, me) => me.done ? wait(me, 'Vote cast!') :
      `<div class="kicker">Vote</div><h2>Who's the odd one out?</h2>${s.clues.filter(c => c.id !== id).map(c => { const p = s.players.find(x => x.id === c.id) || { av: 0, name: '?' };
        return `<button class="opt" data-id="${esc(c.id)}" onclick="send('accuse',{who:this.dataset.id})">${avatar(p)} ${esc(p.name)}: <b>${esc(c.text)}</b></button>`; }).join('')}`,
  },
  draw: {
    draw: (s, me) => s.drawer === id ?
      `<div class="kicker">You're drawing</div><h2 style="font-size:34px;color:var(--gold);margin:0">${esc(s.word)}</h2><p>No letters or numbers!</p>${padHtml}` :
      me.done ? wait(me, 'You got it! 🎉', 'Watch the others guess') :
      `<div class="kicker">Watch the TV</div><h2>What's being drawn?</h2><p style="font-size:28px;letter-spacing:4px">${esc(s.hint)}</p>
       <input id="a" maxlength="30" placeholder="Your guess" autocomplete="off" onkeydown="if (event.key === 'Enter') guess()"><button class="btn" onclick="guess()">Guess</button>`,
  },
  telephone: {
    tstart: (s, me) => me.done ? wait(me, 'Sent down the line!') :
      `<div class="kicker">Start a chain</div><h2>Write something for the next player to draw</h2>
       <input id="a" maxlength="60" placeholder="A dog doing taxes" autocomplete="off"><button class="btn" onclick="send('entry',{text:a.value})">Send</button>`,
    tdraw: (s, me) => me.done ? wait(me, 'Drawing sent!', 'Waiting for the others…') :
      `<div class="kicker">Step ${s.step + 1} of ${s.steps} · Draw this</div><h2 style="color:var(--gold);margin:0">${esc(s.task[id].text)}</h2>${padHtml}
       <button class="btn" onclick="send('entry')">Done drawing</button>`,
    tguess: (s, me) => me.done ? wait(me, 'Sent down the line!') :
      `<div class="kicker">Step ${s.step + 1} of ${s.steps} · What is this?</div>${sketch(s.task[id].strokes, 'task', '100%')}
       <input id="a" maxlength="60" placeholder="Describe the drawing" autocomplete="off"><button class="btn" onclick="send('entry',{text:a.value})">Send</button>`,
    tvote: (s, me) => me.done ? wait(me, 'Vote cast!') :
      `<div class="kicker">Vote</div><h2>Funniest chain?</h2>${s.firsts.map((t, i) => `<button class="opt" onclick="send('tvote',{chain:${i}})">${esc(t)}</button>`).join('')}`,
  },
};
MODES.caption = MODES.quickwit;
const padHtml = `<canvas class="pad" width="1000" height="1000" style="width:100%;aspect-ratio:1;background:#fff;border-radius:16px;touch-action:none"></canvas>
  <div class="row">${['#1a1230', '#ff5e7e', '#4d96ff', '#6bcb77', '#ffd93d', '#ffffff'].map(c => `<button class="pv" aria-label="Colour ${c}" style="background:${c};width:40px;height:40px;border-radius:50%" onclick="pad.c='${c}'"></button>`).join('')}</div>
  <div class="row">${[4, 10, 24].map(w => `<button class="btn ghost" onclick="pad.w=${w}">${w === 4 ? 'Thin' : w === 10 ? 'Medium' : 'Thick'}</button>`).join('')}</div>
  <div class="row"><button class="btn ghost" onclick="send('undo')">↶ Undo</button><button class="btn ghost" onclick="if (confirm('Clear the drawing?')) send('wipe')">🗑 Clear</button></div>`;
function guess() { const el = document.getElementById('a'); send('guess', { text: el.value }); el.value = ''; el.focus(); }
// drawing pad: each finished stroke is sent as points scaled to 0-1000, and the TV redraws them all
const pad = { c: '#1a1230', w: 10 };
function initPad(cv) {
  const x = cv.getContext('2d'); let pts = null;
  const at = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 1000), Math.round((e.clientY - r.top) / r.height * 1000)]; };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); pts = at(e); x.strokeStyle = pad.c; x.lineWidth = pad.w; x.lineCap = x.lineJoin = 'round'; x.beginPath(); x.moveTo(...pts); };
  cv.onpointermove = e => { if (!pts || pts.length >= 1200) return; const p = at(e); pts.push(...p); x.lineTo(...p); x.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { if (pts) { if (pts.length === 2) pts.push(pts[0] + 1, pts[1]); send('stroke', { p: pts, c: pad.c, w: pad.w }); } pts = null; };
}
// undo / clear come back from the server, so the drawer's pad redraws from the shared strokes
function paintPad(s) {
  const cv = app.querySelector('canvas.pad'), strokes = s.pads ? s.pads[id] || [] : s.strokes; if (!cv || !strokes) return;
  if (cv.dataset.n === String(strokes.length) || cv.matches(':active')) return; cv.dataset.n = strokes.length;
  const x = cv.getContext('2d'); x.clearRect(0, 0, 1000, 1000); x.lineCap = x.lineJoin = 'round';
  for (const k of strokes) { x.strokeStyle = k.c; x.lineWidth = k.w; x.beginPath(); x.moveTo(k.p[0], k.p[1]); for (let i = 2; i < k.p.length; i += 2) x.lineTo(k.p[i], k.p[i + 1]); x.stroke(); }
}

// The host's phone gets the TV's controls, so nobody needs a mouse on the TV.
// It lives outside #app and redraws on every update; it has no text boxes, so nothing typed gets wiped.
function hostPanel(s, me) {
  const el = document.getElementById('hostp');
  if (s.host !== id) return el.innerHTML = '';
  // between games the controls are the main thing, so they go on top; mid-game the answer screen comes first
  if (['menu', 'lobby', 'scores', 'results'].includes(s.phase)) app.before(el); else app.after(el);
  const open = el.querySelector('details')?.open, G = s.games.find(x => x.id === s.game), n = s.players.length, nb = s.players.filter(p => p.bot).length;
  const b = (label, js, cls = '') => `<button class="btn ${cls}" onclick="${js}">${label}</button>`;
  let h = `<div class="kicker">👑 You're the host</div>`;
  if (s.phase === 'menu') h += `${s.settings.home === 'menu' ? '' : `<div class="row">${b('🗳 Let players vote', "send('gamevote')")}</div>`}<label>Pick a game</label>${s.games.map(g => `<button class="opt" onclick="send('pick',{game:'${g.id}'})"><b>${esc(g.name)}</b><br>${esc(g.desc)}</button>`).join('')}`;
  else if (s.phase === 'lobby') h += G.settings.map(def => `<label>${esc(def.label)}</label><div class="seg">${def.options.map(([v, l]) =>
      `<button class="${s.settings[def.key] === v ? 'on' : ''}" onclick='send("set",{key:"${def.key}",value:${JSON.stringify(v)}})'>${esc(l)}</button>`).join('')}</div>`).join('')
    + `<div class="row">${n + s.pendingBots >= G.min ? b('▶ Start game', "send('start')") : `<p>Need ${G.min - n} more player${G.min - n === 1 ? '' : 's'}</p>`}</div>`;
  else if (s.phase === 'scores') h += `<div class="row">${b(`▶ Round ${s.round + 1}`, "send('skip')")}</div>`;
  else if (s.phase === 'results') h += `<div class="row">${b('↻ Play again', "send('start')")}</div>`;
  else if (s.phase === 'gamevote') h += `<div class="row">${b('⏭ Pick now', "send('skip')")}${b('← Straight to menu', "send('menu')", 'ghost')}</div>`;
  else h += `<div class="row">${b(s.phase === 'reveal' ? 'Next ▶' : "⏭ Time's up", "send('skip')", 'ghost')}</div>`;
  const home = s.settings.home !== 'menu' && !['lobby', 'gamevote'].includes(s.phase);
  if (s.game && !['lobby', 'menu'].includes(s.phase)) h += `<label>Home button</label><div class="seg">${[['vote', 'Players vote next'], ['menu', 'Back to menu']].map(([v, l]) =>
    `<button class="${(s.settings.home || 'vote') === v ? 'on' : ''}" onclick="send('set',{key:'home',value:'${v}'})">${l}</button>`).join('')}</div>`;
  h += `<div class="row">${!['menu', 'gamevote'].includes(s.phase) ? b(home ? '🏠 Home (vote)' : '🏠 Menu', "send('menu')", 'ghost') : ''}${b(`🤖 − (${nb + s.pendingBots})`, "send('unbot',{n:1})", 'ghost')}${b('🤖 +', "send('bots',{n:1})", 'ghost')}</div>`;
  h += `<details ${open ? 'open' : ''}><summary>Players (${n})</summary>${s.players.map(p => `<div class="pl">${avatar(p)}<span class="nm">${esc(p.name)}${p.id === s.host ? ' 👑' : ''}</span>
    ${p.bot || p.id === s.host ? '' : `<button data-id="${esc(p.id)}" onclick="send('host',{who:this.dataset.id})">👑 Make host</button>`}
    ${p.id === id ? '' : `<button data-id="${esc(p.id)}" onclick="if (confirm('Remove this player?')) send('kick',{who:this.dataset.id})">✕</button>`}</div>`).join('')}</details>`;
  el.innerHTML = h;
}

function watch() {
  es = new EventSource('/events?room=' + room);
  es.onerror = async () => {
    if (es.readyState !== 2) return; // the browser is already retrying by itself
    const alive = await roomAlive(room);
    if (alive === false) leave(); else setTimeout(() => room && watch(), alive ? 500 : 2000);
  };
  es.onmessage = e => {
    const s = JSON.parse(e.data), me = s.players.find(p => p.id === id);
    if (!me) return leave(); // removed from the room
    hostPanel(s, me);
    topEl.innerHTML = `<div class="me">${avatar(me)}${esc(me.name)}${s.host === id ? ' 👑' : ''}</div><div class="pts">${me.score} pts</div><div class="timer" id="timer" hidden><b></b></div>`;
    setTimerFrom(s, document.getElementById('timer'));
    // only redraw when my view changes, so typing isn't wiped by other players' updates
    const between = ['menu', 'lobby', 'scores', 'results'].includes(s.phase);
    const taken = s.players.filter(p => p.id !== id).map(p => p.av);
    const key = `${s.game}|${s.phase}|${s.round}|${s.duelNo}|${me.done}|${s.opts?.[id]?.[0]}|${between ? me.av + ':' + taken + ':' + me.name + ':' + me.ph : ''}`;
    if (key === last) return paintPad(s); last = key; chosen = -1;
    const G = s.games.find(x => x.id === s.game), screen = MODES[s.game]?.[s.phase];
    const rank = [...s.players].sort((a, b) => b.score - a.score).findIndex(p => p.id === id) + 1;
    let html;
    if (s.phase === 'menu') html = wait(me, `You're in, ${esc(me.name)}!`, s.host === id ? 'You pick the game, above.' : 'The host is picking a game.');
    else if (s.phase === 'lobby') html = wait(me, esc(G.name), 'Get ready. The host will start soon.');
    else if (s.phase === 'scores') html = wait(me, `#${rank} with ${me.score} pts`, `Round ${s.round + 1} of ${s.rounds} is coming up!`);
    else if (s.phase === 'gamevote') html = me.done ? wait(me, 'Vote cast!', 'Eyes on the TV!') :
      `<div class="kicker">What's next?</div><h2>Vote for the next game</h2>${G ? `<button class="opt" onclick="send('gvote',{game:'replay'})">↻ <b>Play ${esc(G.name)} again</b></button>` : ''}${s.games.filter(g => g.id !== s.game).map(g =>
        `<button class="opt" onclick="send('gvote',{game:'${g.id}'})"><b>${esc(g.name)}</b><br>${esc(g.desc)}</button>`).join('')}`;
    else if (s.phase === 'results') html = wait(me, `#${rank} with ${me.score} pts`, rank === 1 ? 'You won! 🏆' : 'Eyes on the TV!');
    else html = screen ? screen(s, me) : wait(me, 'Watch the TV');
    // between games players can swap avatars
    if (between) html += `<label for="nm">Change name</label><div class="sndbar"><input id="nm" maxlength="16" value="${esc(me.name)}" autocomplete="nickname" style="flex:1">
      <button class="pv add" onclick="rename()">Save</button></div><label>Change avatar</label>${avGrid(me.av, taken, 'changeAv', me.ph)}`;
    swap(app, html, () => { app.querySelector('input:not(#nm)')?.focus(); drawnAt = Date.now(); const cv = app.querySelector('canvas.pad'); if (cv) { initPad(cv); paintPad(s); } });
  };
}
if (room && q.get('auto') && q.get('name')) send('join', { text: q.get('name') }).then(ok => { if (ok) { store('room', room); watch(); } else joinScreen(); });
else room && store('room') === room ? watch() : joinScreen();
</script></body></html>
