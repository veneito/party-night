[package]
name = "party-night"
version = "1.4.2"
description = "Party games on your TV, played from your phones"
authors = ["Randall J. Russell Hernadez"]
license = "MIT"
repository = "https://github.com/veneito/party-night"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
tokio-stream = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
rand = "0.8"
qrcode = { version = "0.14", default-features = false }
local-ip-address = "0.6"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
